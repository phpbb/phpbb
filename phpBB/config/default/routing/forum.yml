phpbb_forum_mark_all_read:
    path:             /mark-all-read
    defaults:
        _controller:  forum.controller.mark_all_read:handle

phpbb_forum_mark_subforums_read:
    path:             /forum/{id}/mark-subforums-read
    defaults:
        _controller:  forum.controller.mark_subforums_read:handle
    requirements:
        id:         \d+

phpbb_forum_mark_topics_read:
    path:             /forum/{id}/mark-topics-read
    defaults:
        _controller:  forum.controller.mark_topics_read:handle
    requirements:
        id:         \d+
