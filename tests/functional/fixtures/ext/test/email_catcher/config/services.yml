services:
    test.email_catcher.listener:
        class: test\email_catcher\event\listener
        tags:
            - { name: event.listener }

    test.email_catcher.controller.trigger:
        class: test\email_catcher\controller\trigger
        arguments:
            - '@notification_manager'
