name: Installer tests

on:
    push:
        branches:
            - master
            - 'prep-release-*'
    pull_request:
        branches:
            - master
            - 'prep-release-*'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    mysql-installer-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.2'
                      db: mysql
                      db_image: mysql:8.4
                      pdo: '1'
                      label: 'MySQL 8.4 - PDO'
                    - php: '8.2'
                      db: mysql
                      db_image: mysql:8.4
                      pdo: '0'
                      label: 'MySQL 8.4 - native'
                    - php: '8.2'
                      db: mariadb
                      db_image: mariadb:11.4
                      pdo: '1'
                      label: 'MariaDB 11.4 - PDO'

        name: PHP ${{ matrix.php }} - ${{ matrix.label }}

        services:
            mysql:
                image: ${{ matrix.db_image }}
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: phpbb_tests
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mariadb-admin ping || mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            - name: Update Ubuntu package lists
              run: |
                  sudo apt-get update -y --allow-releaseinfo-change

            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Determine PHP extensions
              id: php-ext
              shell: bash
              run: |
                  base="dom, curl, libxml, mbstring, zip, pcntl, intl, gd, exif, iconv, pdo"
                  native="mysqli"
                  pdodrv="pdo_mysql"
                  if [ "${{ matrix.pdo }}" = '1' ]; then
                      echo "extensions=$base, $native, $pdodrv" >> "$GITHUB_OUTPUT"
                  else
                      echo "extensions=$base, $native" >> "$GITHUB_OUTPUT"
                  fi

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: ${{ steps.php-ext.outputs.extensions }}
                  coverage: none

            - name: Get Composer Cache Directory
              id: composer-cache
              run: |
                  cd phpBB
                  echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                  cd ..

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ matrix.php }}-${{ hashFiles('phpBB/composer.lock') }}

            - name: Setup environment for phpBB
              env:
                  DB: ${{ matrix.db }}
                  PHP_VERSION: ${{ matrix.php }}
                  NOTESTS: '0'
              run: |
                  .github/setup-phpbb.sh $DB $PHP_VERSION ${NOTESTS:-0}

            - name: Setup database
              env:
                  DB: ${{ matrix.db }}
                  MYISAM: '0'
              run: |
                  .github/setup-database.sh $DB $MYISAM

            - name: Install phpBB (CLI installer)
              run: |
                  .github/install-phpbb.sh ${{ matrix.db }}

            - name: Run installer functional test
              env:
                  DB: ${{ matrix.db }}
              run: |
                  phpBB/vendor/bin/phpunit --configuration .github/phpunit-${{ matrix.db }}-github.xml tests/functional/installer_pages_test.php --display-all-issues --stop-on-error

    postgres-installer-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.2'
                      db: postgres
                      db_image: postgres:16
                      pdo: '1'
                      label: 'PostgreSQL 16 - PDO'
                    - php: '8.2'
                      db: postgres
                      db_image: postgres:16
                      pdo: '0'
                      label: 'PostgreSQL 16 - native'

        name: PHP ${{ matrix.php }} - ${{ matrix.label }}

        services:
            postgres:
                image: ${{ matrix.db_image }}
                env:
                    POSTGRES_HOST: localhost
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    -v /var/run/postgresql:/var/run/postgresql
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
