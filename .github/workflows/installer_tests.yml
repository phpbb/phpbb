            - name: Run installer functional test
              env:
                  DB: ${{ matrix.db }}
              run: |
                  phpBB/vendor/bin/phpunit --configuration .github/phpunit-${{ matrix.db }}-github.xml tests/functional/installer_pages_test.php --display-all-issues --stop-on-error

    mssql-installer-tests:
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.2'
                      db: mssql
                      db_image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
                      pdo: '1'
                      label: 'MSSQL 2022 - PDO'
                    - php: '8.2'
                      db: mssql
                      db_image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
                      pdo: '0'
                      label: 'MSSQL 2022 - native'

        name: PHP ${{ matrix.php }} - ${{ matrix.label }}

        services:
            mssql:
                image: ${{ matrix.db_image }}
                env:
                    SA_PASSWORD: "Pssw0rd_12"
                    ACCEPT_EULA: "y"
                ports:
                    - 1433:1433
                options: >-
                    --health-cmd="PATH=$PATH:/opt/mssql-tools18/bin:/opt/mssql-tools/bin sqlcmd -C -S localhost -U sa -P 'Pssw0rd_12' -Q \"Use [master]; CREATE DATABASE [phpbb_tests] COLLATE Latin1_General_CI_AS\" || exit 1"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
