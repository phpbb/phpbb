              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ matrix.php }}-${{ hashFiles('phpBB/composer.lock') }}

            - name: Setup environment for phpBB
              env:
                  DB: ${{ matrix.db }}
                  PHP_VERSION: ${{ matrix.php }}
                  NOTESTS: '0'
              run: |
                  .github/setup-phpbb.sh $DB $PHP_VERSION ${NOTESTS:-0}

            - name: Setup database
              env:
                  DB: ${{ matrix.db }}
                  MYISAM: '0'
              run: |
                  .github/setup-database.sh $DB $MYISAM

            - name: Install phpBB (CLI installer)
              run: |
                  .github/install-phpbb.sh ${{ matrix.db }}

            - name: Run installer functional test
              env:
                  DB: ${{ matrix.db }}
              run: |
                  phpBB/vendor/bin/phpunit --configuration .github/phpunit-${{ matrix.db }}-github.xml tests/functional/installer_pages_test.php --display-all-issues --stop-on-error

    sqlite-installer-tests:
        runs-on: ubuntu-latest
